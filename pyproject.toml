[project]
name = "yht_custom"
authors = [
    { name = "Enfono Technologies", email = "sayanth@enfono.com" }
]
description = "Customisation for YHT Trading — Kathoom Alkhobar Trading Co."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", # assertRaises(Exception)
    "B023", # function definition does not bind loop variable
    "B904", # raise without from inside except
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # imported but unused
    "F403", # star imports
    "F405", # undefined from star imports
    "RUF001", # ambiguous unicode character (Arabic strings)
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
